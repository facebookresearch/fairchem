mode: check

# Use an ASE-readable periodic structure for production decisions. Leave null
# only for the deterministic generated FCC installation fallback.
structure: null
generated_atoms: 32
task: omat
charge: 0
spin: null
model: uma-s-1p1
timestep_fs: 0.5

# Fast correctness-check settings.
profile: tf32_eager
graph_version: 2
workers: 1
steps: 5

# Benchmark settings. All visible worker counts are used when null.
expected_steps: 100000
worker_counts: null
warmup_steps: 10
timing_blocks: 5
block_steps: 20

# A case is eligible for recommendation only when it stays within all three
# limits relative to eager FP32. Energy is normalized by system size.
max_energy_error_meV_per_atom: 1.0
max_force_mae_eV_per_A: 0.005
max_force_error_eV_per_A: 0.02

# Null selects a mode-specific filename in the launch directory.
output: null

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
