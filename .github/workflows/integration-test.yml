name: integration-test

on:
  pull_request:
    paths: # this will only trigger on changes to the demo directory, add more here if required
        - 'packages/fairchem-demo-ocpapi/**'
  workflow_call:

jobs:
  test:
    runs-on: 32-core-ubuntu  # TODO add macos tests too
    strategy:
      max-parallel: 10
      matrix:
        python_version: ['3.11', '3.14']

    steps:
      - uses: actions/checkout@v7
        with:
          # Tags are needed for hatch-vcs to version the local packages; a
          # shallow clone builds fairchem-core as 0.1.devN, which fails
          # fairchem-data-oc's fairchem-core lower bound.
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version:  ${{ matrix.python_version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install core dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/fairchem-core[dev]
          pip install -e packages/fairchem-data-oc[dev]
          pip install -e packages/fairchem-demo-ocpapi[dev]
          pip install -e packages/fairchem-applications/fairchem-applications-cattsunami
          pip install -r packages/fairchem-core/tests/integration/requirements.txt # pin test packages

      # The ocpapi integration tests are no longer run in CI:
      # fairchem-demo-ocpapi is unmaintained. Its unit tests still
      # run in the main test workflow.
      - name: Integration tests removed
        run: echo "ocpapi integration tests are not run (package unmaintained)."
