name: lint

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
  merge_group:

jobs:
  uv-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check the workspace lockfile is fresh
        run: uv lock --check

  lint:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 6

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e  packages/fairchem-core[dev]
      - name: ruff
        run: |
          ruff --version
          ruff check packages/fairchem-core/src packages/fairchem-data/fairchem-data-oc/src # tests has a lot of issues , TODO
          ruff format --check packages/fairchem-core/src packages/fairchem-data/fairchem-data-oc/src # tests
