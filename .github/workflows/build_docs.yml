# build the documentation and upload the built artifact
name: build documentation

on:
  workflow_call:
  workflow_dispatch:
  merge_group:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - "contributor check"
    types:
      - completed
env:
  # `BASE_URL` determines, relative to the root of the domain, the URL that your site is served from.
  # E.g., if your site lives at `https://mydomain.org/myproject`, set `BASE_URL=/myproject`.
  # If, instead, your site lives at the root of the domain, at `https://mydomain.org`, set `BASE_URL=''`.
  BASE_URL: ''

jobs:
  # Same rule as test.yml: a PR that edits anything under .github/ gets
  # no automatic docs build, since the build checks out the PR and runs
  # its copy of .github/actions with secrets. A maintainer dispatches
  # this workflow on the PR branch after review. This job never checks
  # out or runs PR code.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      # Uses the compare API only: nothing from the PR is fetched,
      # checked out or executed. The API lists at most 300 files, so a
      # larger PR is treated as blocked (fail closed).
      - name: Block PRs that edit .github/
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/$REPO/compare/$DEFAULT_BRANCH...$HEAD_SHA" --jq '.files[].filename')
          count=$(grep -c . <<< "$files" || true)
          if [ "$count" -ge 300 ] || grep -q '^\.github/' <<< "$files"; then
            gh api "repos/$REPO/statuses/$HEAD_SHA" \
              -f state=failure -f context=build \
              -f description='.github/ edited: maintainer dispatch required' \
              -f target_url="$TARGET_URL" > /dev/null
            echo "This PR edits files under .github/ (or is too large to check), so the docs build does not run automatically."
            echo "A maintainer must review the changes and dispatch this workflow from the PR branch."
            exit 1
          fi

  build:
    needs: guard
    # Checks out and runs PR code with HF_TOKEN: fork PRs go through the
    # external-testing environment, whose required reviewers approve the
    # commit first (same gate as the test jobs).
    environment: >-
      ${{ github.event_name == 'workflow_run' &&
          github.event.workflow_run.head_repository.full_name != github.repository &&
          'external-testing' || 'internal-testing' }}
    runs-on: 4-core-ubuntu-gpu-t4
    permissions:
      contents: read
      # Needed to manually set commit status
      statuses: write

    steps:

    # Check out the code
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # The path to the sha of the commit we want to build will depend
        # on the trigger type. If a workflow_run trigger, then we want
        # the sha from the head of the branch that triggered it. For
        # pushes and manual triggers, we want the sha of the branch.
        ref: |
          ${{
            github.event.workflow_run.head_sha ||
            github.event.pull_request.head.sha ||
            github.sha
          }}
        # Required since actions/checkout began refusing fork PR code in
        # workflow_run jobs. Safe here: fork PRs from all external
        # contributors require maintainer approval before this trusted,
        # secret-holding run can execute (repo Actions setting).
        # See https://gh.io/securely-using-pull_request_target
        allow-unsafe-pr-checkout: true
        # Optional: get full history if needed
        fetch-depth: 0

    - name: Setup
      uses: ./.github/actions/multi-trigger-setup
      with:
          status-context: '${{ github.job }}'

    - uses: actions/setup-node@v7
      with:
        # MyST's renderer uses --env-file, which Node 18 does not support.
        node-version: 24.x

    - name: Install Jupyter Book (via myst)
      run: npm install -g jupyter-book

    - name: Install latexmk
      run: sudo apt-get update && sudo apt-get -y install latexmk pandoc ffmpeg imagemagick texlive-xetex

    # Install dependencies
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.12

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install \
          packages/fairchem-core[docs,adsorbml,extras] \
          packages/fairchem-data-oc[dev] \
          packages/fairchem-applications-cattsunami \
          packages/fairchem-data-omat \
          -r packages/fairchem-core/tests/integration/requirements.txt # pin test packages

    # Build the book
    - name: Build the book
      env:
        QUACC_CONFIG_FILE: docs/.quacc.yml
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # Set FAST_DOCS only if not a push to main
        FAST_DOCS: ${{ (github.event_name != 'push' || github.ref != 'refs/heads/main') && 'true' || '' }}
        # Must match repo name: https://mystmd.org/guide/deployment#deploy-base-url
        BASE_URL: "/fairchem"
      run: |
        python docs/generate_llms.py --check
        # Convert MyST markdown files to Jupyter notebooks if needed to get download as ipynb buttons
        jupytext --to ipynb ./docs/uma_tutorials/*.md
        find ./docs/ -name "*.md" -exec grep -q "format_name: myst" {} \; -print0 | xargs -0 jupytext --to ipynb
        cd docs && jupyter-book build --html --execute --execute-parallel 1
        cp llms.txt llms-full.txt _build/html/

    - name: Upload documentation artifact
      uses: actions/upload-artifact@v7
      with:
        name: docs-html
        path: docs/_build/html/*

    - name: Cleanup
      if: always()
      uses: ./.github/actions/multi-trigger-cleanup
      with:
          status-context: '${{ github.job }}'
