defaults:
  - cluster: v100
  - checkpoint: uma_sm
  - _self_

benchmark_name: gscdb
gscdb_input_data: ${cluster.data_root_dir}/gscdb_inputs.pkl
runner_excluded_datasets:
  - OEEFD
  - Pol130
  - HR46
  - T144
  - OEEF
  - Dip146
metric_excluded_datasets:
  - SC74
  - OEEFD
  - Pol130
  - HR46
  - T144
  - OEEF
  - Dip146
  - AE11
  - AE18
  - 3d4dIPSS

job:
  run_name: ${checkpoint.model_name}
  run_dir: ${cluster.run_dir}
  device_type: ${cluster.device}
  debug: ${cluster.debug}
  scheduler:
    mode: ${cluster.mode}
    distributed_init_method: FILE
    num_array_jobs: 100
    slurm:
      partition: ${cluster.partition}
      mem_gb: ${cluster.mem_gb}
      timeout_hr: 72
  logger:
    _target_: fairchem.core.common.logger.WandBSingletonLogger.init_wandb
    _partial_: true
    entity: fairchem
    project: uma-benchmarks
    group: ${checkpoint.model_name}
    job_type: ${benchmark_name}

runner:
  _target_: fairchem.core.components.calculate.GSCDBRunner
  calculator:
    _target_: fairchem.core.FAIRChemCalculator.from_model_checkpoint
    name_or_path: ${checkpoint.ckpt_path}
    task_name: omol
  input_data: ${gscdb_input_data}
  benchmark_name: ${benchmark_name}
  excluded_datasets: ${runner_excluded_datasets}

reducer:
  _target_: fairchem.core.components.benchmark.GSCDBReducer
  benchmark_name: ${benchmark_name}
  input_data: ${gscdb_input_data}
  excluded_datasets: ${metric_excluded_datasets}
