model_name: uma-s-1p2p1
task_name: omat
temperature_K: 300.0
seed: 42

job:
  device_type: CUDA
  run_dir: ./md-runs
  run_name: fcc-cu-nvt
  seed: ${seed}
  scheduler:
    mode: LOCAL
    ranks_per_node: 1

runner:
  _target_: fairchem.core.components.calculate.MDRunner
  calculator:
    _target_: fairchem.core.FAIRChemCalculator.from_model_checkpoint
    name_or_path: ${model_name}
    task_name: ${task_name}
    inference_settings: turbo
    device: cuda
    workers: 1
  atoms:
    _target_: fairchem.core.datasets.common_structures.get_fcc_crystal_by_num_cells
    n_cells: 2
    atom_type: Cu
    lattice_constant: 3.61
  thermostat:
    _target_: fairchem.core.components.calculate.LangevinThermostat
    temperature_K: ${temperature_K}
    friction_per_fs: 0.01
    use_fix_com_constraint: true
  timestep_fs: 1.0
  steps: 1000
  trajectory_interval: 10
  log_interval: 10
  checkpoint_interval: 100
  heartbeat_interval: 100
  velocity_seed: ${seed}
  initialization_temperature_K: ${temperature_K}
