# Dense (unpruned) uma_sm conserving OMol baseline, trained from scratch on the
# amaia CW cluster. This is the dense anchor of the accuracy-latency Pareto front
# (C=H=128). Train it at the SAME optimizer/epochs as the pruning run you compare
# against (the default PAT recipe is now SOAP/10ep,
# uma_sm_conserving_omol_4M_chanprune_soap.yaml) so the comparison is apples-to-apples.
defaults:
  - uma_sm_conserving_omol_4M
  - override /cluster: fair_amaia_cw
  - _self_

job:
  run_name: uma_sm_omol_4M_conserving_dense
  logger:
    project: esen-chanprune-omol
    entity: null
    group: dense-baseline
  scheduler:
    # base hardcodes qos: h100_ocp_high (ocp cluster); read the amaia cluster's
    # qos/partition instead. Override job.scheduler.num_nodes=4 on the CLI.
    num_nodes: 1
    slurm:
      qos: ${cluster.qos}
      partition: ${cluster.partition}
