# Sphere-channel structured pruning of the uma_sm conserving OMol model, trained
# with SOAP for 10 epochs. This is THE default pruning-aware-training (PAT) recipe:
# the earlier AdamW variant (uma_sm_conserving_omol_4M_chanprune.yaml) was retired
# 2026-08-06 in favour of this one, because the matched 10-epoch sweep showed
# SOAP/10ep (~50k steps) beats AdamW/20ep (~101k steps) on EVERY Pareto point in
# both energy AND forces at half the compute (aggregate OMol val E/F MAE: dense
# 0.1163/0.0110 vs 0.1476/0.0131; s0.25 0.1240/0.0116 vs 0.1558/0.0138; s0.5
# 0.1443/0.0130 vs 0.1705/0.0148). See scripts/README.md for the full front.
#
# This prunes the SAME sphere_channels width C everywhere it is shared (one global
# mask), so the width can later be PHYSICALLY compacted (scripts/compact_channels.py)
# for real dense-inference speedup -- unlike per-layer PAT, which is not compactable.
# The ChannelPruningCallback owns the whole prune/heal schedule.
#
# NOTE: the prune/heal schedule is defined in FRACTIONS of total steps, so `epochs`
# sets the ABSOLUTE healing budget. The earlier SOAP/5ep runs looked worse than
# AdamW purely because 5 epochs starved the healing phase; doubling to 10 epochs
# collapsed the pruning penalty toward AdamW's (s0.25 matched, s0.5 ~5 meV residual)
# -- the SOAP<AdamW gap was healing BUDGET, not a bad SOAP x pruning interaction.
# Do NOT drop below 10 epochs.
#
# Set channel_target_sparsity on the CLI (0.25 -> C=96, 0.5 -> C=64) and
# job.scheduler.num_nodes=4 for the full run.
defaults:
  - uma_sm_conserving_omol_4M
  - optimizer: soap_freq1
  - override /cluster: fair_amaia_cw
  - _self_

epochs: 10

# --- channel-pruning knobs (override on the CLI) ---
channel_prune_mode: sphere          # only "sphere" is supported
channel_target_sparsity: 0.5        # fraction of channels removed (0.25 -> C=96, 0.5 -> C=64)
channel_warmup_frac: 0.05           # dense warmup as fraction of total steps
channel_healing_start_frac: 0.5     # best sweep cell: heal from 50% of steps
chanprune_lr: 8e-4                  # SOAP peak LR (matches soap_freq1)

# Route B (compaction-aware sphere training): set to the TARGET kept sphere width
# = round(sphere_channels * (1 - channel_target_sparsity)) (e.g. 64 for s0.5, 90
# for s0.3). Makes the RMSNorm compute its over-channel statistics over the kept
# width during training, so the compacted sphere model matches EXACTLY (no ~0.08
# eV/A RMSNorm-centering error, no post-hoc re-heal). null => standard training
# (sphere compaction then needs the Route A stats override, which is near-exact).
channel_norm_stats_num_channels: null

backbone:
  # merged into the K4L2 backbone; null is a no-op (norms use num_channels).
  norm_stats_num_channels: ${channel_norm_stats_num_channels}

job:
  run_name: uma_sm_omol_4M_conserving_chanprune_soap_${channel_prune_mode}_s${channel_target_sparsity}_heal${channel_healing_start_frac}
  logger:
    project: esen-chanprune-omol
    entity: null
    group: chanprune-soap-${channel_prune_mode}-s${channel_target_sparsity}
  scheduler:
    # base hardcodes qos: h100_ocp_high (ocp cluster); read the amaia cluster's
    # qos/partition instead. Override job.scheduler.num_nodes=4 on the CLI.
    num_nodes: 1
    slurm:
      qos: ${cluster.qos}
      partition: ${cluster.partition}

# Route SOAP's peak LR through chanprune_lr so the LR knob stays a single source of
# truth (chanprune_lr defaults to 8e-4, matching soap_freq1).
optimizer:
  lr: ${chanprune_lr}

runner:
  train_eval_unit:
    optimizer_fn: ${optimizer}
    cosine_lr_scheduler_fn:
      _target_: fairchem.core.units.mlip_unit.mlip_unit._get_consine_lr_scheduler
      _partial_: true
      warmup_factor: 0.1
      warmup_epochs: 0.15
      lr_min_factor: 0.01
      epochs: ${epochs}
      steps: ${steps}
  # redefine the full callback list (OmegaConf lists replace, not merge) to append
  # the channel-pruning callback after the base profiler + checkpoint callbacks.
  callbacks:
    - _target_: fairchem.core.common.profiler_utils.ProfilerCallback
      job_config: ${job}
    - _target_: fairchem.core.components.train.train_runner.TrainCheckpointCallback
      checkpoint_every_n_steps: 5000
      max_saved_checkpoints: 5
    - _target_: fairchem.core.models.uma.channel_pruning.ChannelPruningCallback
      mode: ${channel_prune_mode}
      target_sparsity: ${channel_target_sparsity}
      warmup_frac: ${channel_warmup_frac}
      healing_start_frac: ${channel_healing_start_frac}
