# Weight-only PARQ quantization-aware training for UMA-sm conserving on OMol-4M.
#
# Inherits the dense conserving recipe and swaps the runner + train-eval unit for
# their PARQ-aware subclasses. Override the bit-width per run, e.g.:
#   fairchem -c configs/esen/uma_sm_conserving_omol_4M_parq.yaml parq_bits=8
#   fairchem -c configs/esen/uma_sm_conserving_omol_4M_parq.yaml parq_bits=4
#
# Requires the `quant` extra (torchao): pip install fairchem-core[quant]
defaults:
  - uma_sm_conserving_omol_4M
  - _self_

job:
  run_name: uma_sm_omol_4M_0experts_conserving_parq

# Bit-width for the quantizable weights (SO(2)/SO(3)/radial/scalar linears).
# The atom embeddings, norms, and the energy/force head stay full precision.
parq_bits: 8

# PARQ soft->hard anneal horizon. parq_total_steps MUST equal the actual number
# of optimizer steps for this run (epochs * steps_per_epoch for the given dataset
# and data-parallel world size). For OMol-4M, 20 epochs on 32 GPUs this is 101200.
# Update it if epochs, dataset, or world size change.
parq_total_steps: 101200
parq_anneal_start_frac: 0.10
parq_anneal_end_frac: 0.90
parq_anneal_steepness: 10.0
parq_warmup_steps: 0
parq_quant_period: 10

runner:
  _target_: fairchem.core.modules.quantization.parq.PARQTrainEvalRunner
  parq_log_every: 100
  train_eval_unit:
    _target_: fairchem.core.modules.quantization.parq.PARQMLIPTrainEvalUnit
    parq_bits: ${parq_bits}
    parq_lr: 8e-4
    parq_weight_decay: 1e-3
    parq_total_steps: ${parq_total_steps}
    parq_anneal_start_frac: ${parq_anneal_start_frac}
    parq_anneal_end_frac: ${parq_anneal_end_frac}
    parq_anneal_steepness: ${parq_anneal_steepness}
    parq_warmup_steps: ${parq_warmup_steps}
    parq_quant_period: ${parq_quant_period}
