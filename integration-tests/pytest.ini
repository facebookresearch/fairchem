[pytest]
# Make fairchem-core's tests package importable so conftest.py can
# register it as a plugin (see conftest.py).
pythonpath = ../packages/fairchem-core
addopts = -p no:warnings -x --quiet -rxXs --color yes
filterwarnings =
    ignore::UserWarning
    ignore::FutureWarning
    ignore::RuntimeWarning
