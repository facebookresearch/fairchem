#
# Root workspace project (virtual): this file makes the repository a
# single uv workspace. It is not itself published. Each distribution
# under packages/ keeps its own pyproject.toml with hatchling as the
# build backend, so the usual pip workflows (e.g.
# `pip install -e packages/fairchem-core[dev]`) keep working
# unchanged; pip simply ignores the [tool.uv] tables.
#
# Install control (uv only): `uv sync` installs just the default
# distributions (fairchem-core and fairchem-lammps). Add groups with
# extras, e.g.:
#
#   uv sync --extra data           # + fairchem.data.*
#   uv sync --extra applications   # + fairchem.applications.*
#   uv sync --all-extras           # everything

[project]
name = "fairchem"
version = "0.0.0"
description = "Workspace root for the fairchem monorepo (not published)"
requires-python = ">=3.11, <3.15"
dependencies = [
    "fairchem-core",
    "fairchem-lammps",
]

[project.optional-dependencies]
data = [
    "fairchem-data-oc",
    "fairchem-data-odac",
    "fairchem-data-omat",
    "fairchem-data-omc",
    "fairchem-data-omol",
]
applications = [
    "fairchem-applications-adsorbml",
    "fairchem-applications-cattsunami",
    "fairchem-applications-fastcsp",
    "fairchem-applications-ocx",
]
demo = [
    "fairchem-demo-ocpapi",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "packages/fairchem-data/*"]
# fairchem-core-numpy126 publishes the same distribution name as
# fairchem-core (a build variant with different pins), so it cannot
# be a workspace member alongside it.
exclude = ["packages/fairchem-core-numpy126"]

[tool.uv.sources]
fairchem-core = { workspace = true }
fairchem-data-oc = { workspace = true }
fairchem-data-odac = { workspace = true }
fairchem-data-omat = { workspace = true }
fairchem-data-omc = { workspace = true }
fairchem-data-omol = { workspace = true }
fairchem-applications-adsorbml = { workspace = true }
fairchem-applications-cattsunami = { workspace = true }
fairchem-applications-fastcsp = { workspace = true }
fairchem-applications-ocx = { workspace = true }
fairchem-demo-ocpapi = { workspace = true }
fairchem-lammps = { workspace = true }
